[project]
name = "folder-index-mcp"
version = "0.1.0"
description = "Local full-text index (SQLite FTS5) of any folder, exposed to Claude and other AI agents as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Agung Raka Wibawa" }]
keywords = ["mcp", "model-context-protocol", "claude", "full-text-search", "sqlite", "fts5", "file-index"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=2.0,<3",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/git-raka/folder-index-mcp"
Issues = "https://github.com/git-raka/folder-index-mcp/issues"

[project.scripts]
folder-index = "folder_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folder_index"]

[dependency-groups]
dev = ["pytest>=8"]
