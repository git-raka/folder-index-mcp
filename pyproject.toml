[project]
name = "folder-index-mcp"
version = "0.3.0"
description = "Local full-text index (SQLite FTS5) of any folder, exposed to Claude and other AI agents as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Agung Raka Wibawa" }]
keywords = ["mcp", "model-context-protocol", "claude", "full-text-search", "sqlite", "fts5", "file-index"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=2.0,<3",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# OCR for scanned PDFs and images: Windows' built-in OCR engine, or a `tesseract` binary on PATH
ocr = [
    "pypdfium2>=4.30",
    "pillow>=10",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
# desktop app: window + tray icon (`folder-index-app`)
app = [
    "folder-index-mcp[ocr]",
    "pywebview>=5.0",
    "pystray>=0.19",
]

[project.urls]
Homepage = "https://github.com/git-raka/folder-index-mcp"
Issues = "https://github.com/git-raka/folder-index-mcp/issues"

[project.scripts]
folder-index = "folder_index.cli:main"

[project.gui-scripts]
folder-index-app = "folder_index.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folder_index"]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]
